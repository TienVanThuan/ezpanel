# Phát hành EzPanel: vào tab Actions → "Phát hành EzPanel" → Run workflow → nhập số phiên bản (ví dụ 3.0.6).
# GitHub dựng bộ cài trên Windows rồi đăng lên Releases (kèm latest.yml, .blockmap); EzPanel trên mọi máy tự thấy bản mới.
name: Phát hành EzPanel
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Số phiên bản mới, ví dụ 3.0.6 (phải lớn hơn bản đang dùng)'
        required: true
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Đặt phiên bản và nơi đăng bản phát hành
        run: node .github/scripts/set-version.js
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      - name: Dựng bộ cài và tải lên bản nháp trên GitHub Releases
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Công bố bản phát hành (tạo thẻ vX.Y.Z)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          V=$(node -p "require('./package.json').version")
          # Cùng kho mã nguồn: thẻ trỏ vào đúng lần commit vừa dựng; kho phát hành riêng: thẻ trỏ vào nhánh mặc định của kho đó
          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then TARGET="--target $GITHUB_SHA"; else TARGET=""; fi
          gh release edit "v$V" --repo "$TARGET_REPO" --draft=false --latest $TARGET
          echo "Đã công bố: https://github.com/$TARGET_REPO/releases/tag/v$V"
